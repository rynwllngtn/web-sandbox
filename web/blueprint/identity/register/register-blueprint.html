<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Register Blueprint</title>
        <link rel="stylesheet" href="register-blueprint.css"/>
        <style>
            main {
                outline: black solid 2px;
            }

            .register-info {
                outline: red dashed 1px;
                outline-offset: -2px;

                & * {
                    outline: black dashed 1px;
                    outline-offset: -1px;
                }
            }

            .register-form {
                outline: blue dashed 1px;
                outline-offset: -2px;

                & * {
                    outline: black dashed 1px;
                    outline-offset: -1px;
                }
            }

            .form-main section {
                display: none;
                flex-direction: column;
            }
        </style>
    </head>
    <body>
        <main>
            <section class="register-form">
                <header class="form-header">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <rect width="50" height="50" fill="black"/>
                    </svg>
                    <h1>Bank Title</h1>
                </header>
                <div class="form-wrapper">
                    <header class="form-title">
                        <h2>Registration Title</h2>
                        <p>Registration Text</p>
                    </header>
                    <div class="form-progress">
                        <svg class="progress-line">
                            <line x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4"/>
                        </svg>
                        <div class="progress-dots">
                            <svg id="dot-1" class="dot active">
                                <circle cx="15" cy="15" r="15"/>
                            </svg>
                            <svg id="dot-2" class="dot">
                                <circle cx="15" cy="15" r="15"/>
                            </svg>
                            <svg id="dot-3" class="dot">
                                <circle cx="15" cy="15" r="15"/>
                            </svg>
                        </div>
                    </div>
                    <form class="form-main">
                        <section id="section-1" class="register-identity" style="display: flex">
                            <div class="form-input">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" name="cpf">
                            </div>
                            <button type="button" onclick="formSection(2)">Continue</button>
                        </section>
                        <section id="section-2" class="register-data">
                            <div class="form-input">
                                <label for="email">Email</label>
                                <input type="text" id="email" name="email">
                            </div>
                            <div class="form-input">
                                <label for="username">Username</label>
                                <input type="text" id="username" name="username">
                            </div>
                            <div class="form-buttons">
                                <button class="btn-secondary" type="button" onclick="formSection(1)">Back</button>
                                <button class="btn-primary" type="button" onclick="formSection(3)">Continue</button>
                            </div>
                        </section>
                        <section id="section-3" class="register-secrets">
                            <div class="form-input">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password">
                            </div>
                            <div class="form-input">
                                <label for="password-confirm">Password Confirmation</label>
                                <input type="password" id="password-confirm" name="password-confirm">
                            </div>
                            <div class="form-buttons">
                                <button class="btn-secondary" type="button" onclick="formSection(2)">Back</button>
                                <button class="btn-primary" type="submit">Register</button>
                            </div>
                        </section>
                    </form>
                </div>
                <footer class="form-footer">
                    <p>Already have an account? <a href="#">Login</a></p>
                </footer>
            </section>
            <aside class="register-info">
                <p class="info-title">Welcome Title</p>
                <p class="info-text">Welcome Text</p>
            </aside>
        </main>
        <script>
            function formSection(stepNumber) {
                document.getElementById("section-1").style.display = "none";
                document.getElementById("section-2").style.display = "none";
                document.getElementById("section-3").style.display = "none";

                document.getElementById("dot-1").classList.remove("active");
                document.getElementById("dot-2").classList.remove("active");
                document.getElementById("dot-3").classList.remove("active");

                document.getElementById("section-" + stepNumber).style.display = "flex";
                for(let i = 1; i <= stepNumber; i++) {
                    document.getElementById("dot-" + i).classList.add("active");
                }
            }
        </script>
    </body>
</html>
