<main class="register-layout">
    <section class="register-panel">
        <header class="panel-header">
            <svg class="logo-sandbox" width="50" height="50" aria-hidden="true">
                <use href="/assets/logo.svg#sandbox-logo"></use>
            </svg>
            <h1>SANDBOX</h1>
        </header>
        <form class="panel-form">
            <header class="form-header">
                <h2>Create your account</h2>
                <p>Follow the steps below to get started with SandBox</p>
            </header>
            <div class="form-progress">
                <svg id="dot-1" class="dot active" viewBox="0 0 30 30">
                    <circle cx="15" cy="15" r="12"/>
                </svg>
                <svg class="progress-line">
                    <line class="line-bg" x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4"/>
                    <line class="line-fill" x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4" pathLength="1"/>
                </svg>
                <svg id="dot-2" class="dot" viewBox="0 0 30 30">
                    <circle cx="15" cy="15" r="12"/>
                </svg>
                <svg class="progress-line">
                    <line class="line-bg" x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4"/>
                    <line class="line-fill" x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4" pathLength="1"/>
                </svg>
                <svg id="dot-3" class="dot" viewBox="0 0 30 30">
                    <circle cx="15" cy="15" r="12"/>
                </svg>
            </div>
            <section id="section-1" class="section-step" data-section="1" style="display: flex">
                <div class="form-input">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required/>
                </div>
                <button id="btn-next-section-1" class="btn-primary" type="button">Continue</button>
            </section>
            <section id="section-2" class="section-step" data-section="2">
                <div class="form-input">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" autocomplete="email" required>
                </div>
                <div class="form-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="How should we call you?" autocomplete="username" required>
                </div>
                <div class="form-buttons">
                    <button id="btn-back-section-1" class="btn-secondary" type="button">Back</button>
                    <button id="btn-next-section-2" class="btn-primary" type="button">Continue</button>
                </div>
            </section>
            <section id="section-3" class="section-step" data-section="3">
                <div class="form-input">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                </div>
                <div class="form-input">
                    <label for="password-confirm">Password Confirmation</label>
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="••••••••" autocomplete="new-password" required>
                </div>
                <div class="form-buttons">
                    <button id="btn-back-section-2" class="btn-secondary" type="button">Back</button>
                    <button id="btn-register" class="btn-primary" type="submit">Create Account</button>
                </div>
            </section>
        </form>
        <footer class="panel-footer">
            <p>Already have an account? <a class="links" data-route="/login">Sign In</a></p>
        </footer>
    </section>
    <aside class="register-info">
        <h2 class="info-title">Start your journey with SandBox.</h2>
        <p class="info-text">Open your digital account in minutes with zero hidden fees and complete control over your finances.</p>
    </aside>
</main>
