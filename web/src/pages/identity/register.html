<main class="register-layout">
    <section class="register-panel">
        <header class="panel-header">
            <svg width="50" height="50" viewBox="0 0 50 50">
                <rect width="50" height="50" fill="black"/>
            </svg>
            <h1>Bank Title</h1>
        </header>
        <form class="panel-form">
            <header class="form-header">
                <h2>Registration Title</h2>
                <p>Registration Text</p>
            </header>
            <div class="form-progress">
                <svg class="progress-line">
                    <line x1="0" y1="50%" x2="100%" y2="50%" stroke-width="4"/>
                </svg>
                <div class="progress-dots">
                    <svg id="dot-1" class="dot active">
                        <circle cx="15" cy="15" r="15"/>
                    </svg>
                    <svg id="dot-2" class="dot">
                        <circle cx="15" cy="15" r="15"/>
                    </svg>
                    <svg id="dot-3" class="dot">
                        <circle cx="15" cy="15" r="15"/>
                    </svg>
                </div>
            </div>
            <section id="section-1" class="section-step" data-section="1" style="display: flex">
                <div class="form-input">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required/>
                </div>
                <button id="btn-next-section-1" type="button">Continue</button>
            </section>
            <section id="section-2" class="section-step" data-section="2">
                <div class="form-input">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <div class="form-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-buttons">
                    <button id="btn-back-section-1" class="btn-secondary" type="button">Back</button>
                    <button id="btn-next-section-2" class="btn-primary" type="button">Continue</button>
                </div>
            </section>
            <section id="section-3" class="section-step" data-section="3">
                <div class="form-input">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-input">
                    <label for="password-confirm">Password Confirmation</label>
                    <input type="password" id="password-confirm" name="password-confirm" required>
                </div>
                <div class="form-buttons">
                    <button id="btn-back-section-2" class="btn-secondary" type="button">Back</button>
                    <button id="btn-register" class="btn-primary" type="submit">Register</button>
                </div>
            </section>
        </form>
        <footer class="panel-footer">
            <p>Already have an account? <a data-route="/login">Login</a></p>
        </footer>
    </section>
    <aside class="register-info">
        <h2 class="info-title">Welcome Title</h2>
        <p class="info-text">Welcome Text</p>
    </aside>
</main>
