<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/identity/login.css">
</head>
<body>
<main class="main-container">
    <div class="login-title">
        <h1>Sandbox Bank</h1>
        <span class="details-span">Please enter your details.</span>
    </div>
    <form>
        <div class="input-group">
            <label for="input-cpf">CPF</label>
            <input id="input-cpf" type="text" name="cpf" placeholder="000.000.000-00"  required>
        </div>
        <div class="input-group">
            <label for="input-password">Password</label>
            <input id="input-password" type="password" name="password" placeholder="********" required>
        </div>
        <button class="btn-login" type="submit">Login</button>
    </form>
    <span class="sighup-span" >Don't have an account?<a class="links" href="">Sign up!</a></span>
</main>
</body>
</html>
