services:

  api:
    build:
      context: ..
      dockerfile: identity/Dockerfile
    image: api
    container_name: api
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/samples"
    volumes:
      - identity_data:/app/data

volumes:
  identity_data: