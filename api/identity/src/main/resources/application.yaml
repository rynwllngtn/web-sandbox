spring:
  application:
    name: api

  cors:
    # $env:CORS_ALLOWED_ORIGINS="url"
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  datasource:
    url: jdbc:h2:file:../data/samples
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console